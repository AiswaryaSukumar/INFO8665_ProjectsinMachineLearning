services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insight311-backend
    ports:
      - "8311:8311"
    env_file:
      - ./backend/.env
    environment:
      SKIP_ML_INIT: "false"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insight311-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
