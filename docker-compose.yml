# ── INSIGHT-311 Docker Compose ─────────────────────────────
# Services: app, prometheus, grafana, loki, promtail

secrets:
  db_url:
    file: ./secrets/db_url.txt
  db_username:
    file: ./secrets/db_username.txt
  db_password:
    file: ./secrets/db_password.txt
  db_hostname:
    file: ./secrets/db_hostname.txt
  db_port:
    file: ./secrets/db_port.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

services:
  # ── FastAPI Application ──────────────────────────────────
  app:
    build: .
    container_name: insight311-app
    ports:
      - "8311:8311"
    secrets:
      - db_url
      - db_username
      - db_password
      - db_hostname
      - db_port
    environment:
      - LOG_LEVEL=INFO
      - DATABASE_URL_FILE=/run/secrets/db_url
      - DB_USERNAME_FILE=/run/secrets/db_username
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_HOSTNAME_FILE=/run/secrets/db_hostname
      - DB_PORT_FILE=/run/secrets/db_port
    volumes:
      # Persist audio data
      - ./stt_service/data:/app/stt_service/data
      # Mount ML models (not baked into image)
      - ./nlp_service/ml_models/saved_models:/app/nlp_service/ml_models/saved_models
      - whisper-cache:/root/.cache/whisper
      - hf-cache:/root/.cache/huggingface
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8311/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # ML models take time to load

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: insight311-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: insight311-grafana
    ports:
      - "3000:3000"
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ── Loki (log aggregation) ──────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: insight311-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # ── Promtail (log shipper) ──────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: insight311-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ── Web Frontend (React + Vite) ────────────────────────
  web-ui:
    image: node:20-slim
    container_name: insight311-web-ui
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./ui/web-agent:/app
      - web-ui-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  whisper-cache:
  hf-cache:
  web-ui-node-modules:
