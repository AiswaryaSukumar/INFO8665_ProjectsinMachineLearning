# Promtail configuration for INSIGHT-311
# Ships Docker container logs to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url:  http://insight311-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only insight311 containers
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(insight311-.*)"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # Parse plain-text logging output from the app container
      - match:
          selector: '{container="insight311-app"}'
          stages:
            - regex:
                expression: '^(?P<timestamp>\S+ \S+) - (?P<logger>\S+) - (?P<level>\w+) - (?P<message>.*)$'
            - labels:
                level:
                logger:
